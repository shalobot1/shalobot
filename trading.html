<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Trading | Shalobot</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#1F1E1C" />
<link rel="icon" href="/favicon.ico" sizes="48x48" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<script>
/* Applied before paint, exactly as on every other page: the dotted charcoal
   ground is the default, light is the saved alternative. */
(function(){try{var t=localStorage.getItem("shalo_theme");
document.documentElement.setAttribute("data-theme",t==="light"?"light":"dark");}catch(e){document.documentElement.setAttribute("data-theme","dark");}})();
</script>
<!-- The live feeds open to Deriv the moment the page runs; resolving the host
     early takes a round trip off the first balance. -->
<link rel="dns-prefetch" href="https://api.derivws.com" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/deriv/trading.css" />
</head>
<body class="tpage">

<header class="nav tnav">
  <div class="bleed nav-inner">
    <a class="brand" href="/trading">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="32" height="32"><rect width="64" height="64" rx="15" fill="#1F1E1C"/><path d="M17 41c0 8 8 10 15 10s15-2 15-9c0-8-10-8-15-9s-14-2-14-9c0-7 7-9 13-9 5 0 9 1 12 4" fill="none" stroke="#3ddc97" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="17" r="5.5" fill="#ffb020"/></svg>
      </span>
      <span class="brand-name">Shalobot</span>
    </a>

    <div class="tnav-end">
      <!-- The language, on its own — there before an account is, and the same
           switch every other page carries. -->
      <div class="tnav-lang" data-lang-switch></div>

      <!-- The account in use, and the way to the other one, on the page's own
           surfaces. Real is green; demo is black on light and white on
           charcoal, so it reads on either. -->
      <div class="tbal" id="acct" hidden>
        <button class="tbal-chip" id="acctBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="acctMenu">
          <span class="tbal-live" id="acctLive" aria-hidden="true"></span>
          <span class="tbal-kind" id="acctKind">Real</span>
          <span class="tbal-amt" id="acctAmt" data-i18n-skip>—</span>
          <svg class="tbal-caret" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
        <div class="tbal-menu" id="acctMenu" role="menu" hidden>
          <div class="tbal-list" id="acctList"></div>
          <div class="tbal-foot">
            <button class="tbal-out" id="acctOut" type="button" role="menuitem">Disconnect</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>

<main class="tmain" id="tmain">
  <!-- Only shown when there is something to say: connecting, not connected,
       or Deriv not answering. Once the balances are live the page is just
       the ground, ready for what comes next. -->
  <section class="tstate" id="tState" aria-live="polite" hidden>
    <div class="tstate-busy" id="tBusy" hidden>
      <span class="tspin" aria-hidden="true"></span>
      <p id="tBusyText">Connecting to Deriv…</p>
    </div>

    <div class="tconnect" id="tConnect" hidden>
      <span class="tconnect-mark" aria-hidden="true">
        <img src="/logos/deriv-wordmark.svg" alt="" width="72" height="24" />
      </span>
      <h1>Connect your Deriv account</h1>
      <p class="tconnect-lede" id="tConnectMsg">Sign in on Deriv's own page and come straight back. Shalobot never sees your password.</p>
      <div class="tconnect-actions">
        <a class="btn btn-blue btn-lg" id="tLogin" href="/api/deriv/start">I have a Deriv account — connect</a>
        <a class="btn btn-line btn-lg" href="https://track.deriv.com/_30qaRjl291f1hit6RV3zsGNd7ZgqdRLk/1/" target="_blank" rel="noopener sponsored">New to Deriv? Create a free account</a>
      </div>
      <p class="tconnect-fine">Created your account? Come back here and press connect.</p>
    </div>

    <div class="tnote" id="tNote" hidden>
      <p id="tNoteText"></p>
    </div>
  </section>
</main>

<script src="/i18n/i18n.js"></script>
<script src="/theme.js"></script>
<script src="/deriv/trading.js"></script>
</body>
</html>
